<!doctype html>
<!-- Profile README header (1584×396 CSS px, rendered at 2x). Source of header.png:
     chrome --headless --hide-scrollbars --force-device-scale-factor=2 --window-size=1584,396 --screenshot=header.png header.html
     Same palette as the LinkedIn banner (ios-career/assets/linkedin/banner.html). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #121212; --text: #f5f5f5; --muted: #a3a3a3; --accent: #ff5a1f; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1584px; height: 396px; overflow: hidden; background: var(--bg); }
  body {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 50% 135%, rgba(255, 90, 31, 0.24), transparent 48%),
      var(--bg);
  }
  .block { text-align: center; }
  .accent { width: 72px; height: 6px; background: var(--accent); border-radius: 3px; margin: 0 auto 28px; }
  h1 { font-size: 92px; font-weight: 700; letter-spacing: -1.5px; line-height: 1; }
  .role { margin-top: 18px; font-size: 40px; font-weight: 600; color: var(--accent); }
  .tagline { margin-top: 20px; font-size: 32px; font-weight: 500; color: var(--muted); }
</style>
</head>
<body>
  <div class="block">
    <div class="accent"></div>
    <h1>Donato Gómez</h1>
    <p class="role">iOS Developer</p>
    <p class="tagline">Native iOS apps, from architecture to App Store release</p>
  </div>
</body>
</html>
